name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # O Node 24.18+ traz o npm 11.16+ exigido pelo package.json (engines e devEngines).
      # Hoje o toolcache do runner tem o Node 24.21.0, com o npm 11.19.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Instala exatamente o package-lock.json, sem rodar scripts de dependências (docs/03-seguranca.md, seção 3.14).
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publicar o protótipo do holograma
        uses: actions/upload-artifact@v7
        with:
          name: hologram-lab
          path: apps/hologram-lab/dist
          retention-days: 14
